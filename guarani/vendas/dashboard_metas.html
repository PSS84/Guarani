<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Metas — Guarani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sidebar-bg:    #1B3828;
  --sidebar-hover: rgba(255,255,255,0.08);
  --sidebar-active:rgba(255,255,255,0.14);
  --bg:            #EEF2EF;
  --surface:       #FFFFFF;
  --surface2:      #F7FAF8;
  --border:        rgba(0,0,0,0.07);
  --shadow:        0 1px 3px rgba(0,0,0,0.06), 0 6px 20px rgba(0,0,0,0.06);
  --shadow-sm:     0 1px 2px rgba(0,0,0,0.05), 0 2px 6px rgba(0,0,0,0.05);
  --text:          #0D1F17;
  --label:         #374151;
  --muted:         #64748B;
  --sub:           #94A3B8;
  /* indicadores */
  --c-ind:   #059669;
  --c-eq:    #3B82F6;
  --c-apres: #7C3AED;
  --c-prop:  #D97706;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* ── SIDEBAR ──────────────────────────────────────────── */
.sidebar {
  width: 220px; flex-shrink: 0;
  background: var(--sidebar-bg);
  display: flex; flex-direction: column;
  height: 100vh; overflow: hidden;
}

.sidebar-logo {
  display: flex; align-items: center;
  padding: 18px 18px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.sidebar-logo img {
  width: 34px; height: 34px; border-radius: 8px;
  object-fit: cover;
}
.sidebar-logo-name { font-size: 12px; font-weight: 700; color: #fff; line-height: 1.3; }
.sidebar-logo-sub  { font-size: 9px; color: rgba(255,255,255,0.45); letter-spacing:.04em; }

/* Profile zone */
.sidebar-profile {
  display: flex; flex-direction: column; align-items: center;
  padding: 20px 16px 16px; gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.profile-photo {
  width: 80px; height: 80px; border-radius: 50%;
  object-fit: cover; object-position: center top;
  border: 2px solid rgba(255,255,255,0.15);
  box-shadow: 0 0 0 2px var(--c-ind), 0 4px 16px rgba(0,0,0,0.3);
}
.profile-photo-placeholder {
  width: 80px; height: 80px; border-radius: 50%;
  background: #2D6A4F; border: 2px solid rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 800; color: rgba(255,255,255,0.7);
}
.profile-name { font-size: 13px; font-weight: 700; color: #fff; text-align: center; line-height: 1.3; }
.profile-role { font-size: 9px; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing:.07em; text-align:center; }

/* Score ring */
.score-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; }
.score-ring  { position:relative; width:80px; height:80px; }
.score-ring svg { transform:rotate(-90deg); }
.score-ring-label {
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
}
.score-ring-val { font-size:16px; font-weight:800; color:#fff; line-height:1; }
.score-ring-sub { font-size:8px; color:rgba(255,255,255,0.45); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }
.score-caption  { font-size:9px; color:rgba(255,255,255,0.45); }
.score-como { font-size:9px; color:rgba(255,255,255,0.4); text-decoration:underline; cursor:pointer; }
.score-como:hover { color:rgba(255,255,255,0.7); }

/* KPI boxes (meta ind / equipe) */
.kpi-boxes { display:flex; gap:6px; width:100%; }
.kpi-box {
  flex:1; background:rgba(255,255,255,0.07); border-radius:8px;
  padding:8px 10px; text-align:center;
}
.kpi-box-label { font-size:8px; color:rgba(255,255,255,0.45); text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:3px; }
.kpi-box-val   { font-size:15px; font-weight:800; display:block; }

.sidebar-footer {
  margin-top:auto;
  padding:12px 16px;
  font-size:9px; color:rgba(255,255,255,0.30);
  border-top:1px solid rgba(255,255,255,0.07);
  letter-spacing:.02em;
}

/* ── CONTENT ──────────────────────────────────────────── */
.content { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }

/* Topbar */
.topbar {
  background:var(--surface);
  padding:12px 28px;
  display:flex; align-items:center; justify-content:space-between;
  box-shadow:0 1px 0 var(--border), 0 2px 8px rgba(0,0,0,0.04);
  flex-shrink:0; gap:16px;
}
.topbar-left  { display:flex; align-items:center; gap:10px; }
.topbar-right { display:flex; align-items:center; gap:12px; }

.tb-select {
  font-family:'Inter',sans-serif; font-size:13px; font-weight:500;
  color:var(--text); background:var(--surface2);
  border:1px solid var(--border); border-radius:8px;
  padding:7px 14px; outline:none; cursor:pointer;
  box-shadow:var(--shadow-sm); transition:border-color .2s;
}
.tb-select:focus { border-color:var(--c-ind); }
#vendedorSelect { min-width:200px; }

.tb-btn {
  font-family:'Inter',sans-serif; font-size:12px; font-weight:600;
  color:var(--muted); background:var(--surface);
  border:1px solid var(--border); border-radius:7px;
  padding:6px 14px; cursor:pointer; transition:all .15s;
}
.tb-btn:hover { border-color:var(--c-ind); color:var(--c-ind); }

.topbar-ts { font-size:11px; color:var(--sub); display:flex; align-items:center; gap:6px; }
.topbar-ts::before { content:'◷'; font-size:13px; }
.topbar-title { font-size:13px; font-weight:600; color:var(--muted); letter-spacing:.3px; }

/* Main scrollable */
.main {
  flex:1; overflow-y:auto; padding:20px 24px;
  display:flex; flex-direction:column; gap:16px;
}

/* ── ALERTS ───────────────────────────────────────────── */
.alerts-card {
  background:var(--surface); border-radius:12px;
  padding:16px 22px; box-shadow:var(--shadow-sm);
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}
.alerts-title { font-size:11px; font-weight:700; color:var(--label); margin-right:8px; white-space:nowrap; }
.alert-sep    { width:1px; height:24px; background:var(--border); flex-shrink:0; }
.alert-item   { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--label); flex:1; min-width:200px; }
.alert-dot    { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.alert-dot.red    { background:#DC2626; box-shadow:0 0 6px rgba(220,38,38,0.5); }
.alert-dot.amber  { background:#D97706; box-shadow:0 0 6px rgba(217,119,6,0.5); }
.alert-dot.green  { background:#059669; box-shadow:0 0 6px rgba(5,150,105,0.5); }
.alert-dot.blue   { background:#3B82F6; }

/* ── KPI ROW ──────────────────────────────────────────── */
.kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }

.kpi-card {
  background:var(--surface); border-radius:12px;
  padding:16px 18px; box-shadow:var(--shadow-sm);
  border-left:4px solid transparent;
  display:flex; flex-direction:column; gap:0;
  position:relative; overflow:hidden;
}
.kpi-card-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:6px; }
.kpi-card-label  { font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; }
.kpi-sparkline   { flex-shrink:0; margin-top:-2px; }
.kpi-val  { font-size:30px; font-weight:900; line-height:1; }
.kpi-sub  { font-size:10px; color:var(--sub); margin-top:3px; }
.kpi-delta{ font-size:11px; font-weight:600; margin-top:4px; }
.kpi-delta.pos { color:var(--c-ind); }
.kpi-delta.neg { color:#DC2626; }
.kpi-delta.neu { color:var(--sub); }
.kpi-trend { font-size:10px; color:var(--sub); margin-top:1px; }

/* ── CHARTS ROW ───────────────────────────────────────── */
.charts-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }

.chart-card {
  background:var(--surface); border-radius:12px;
  padding:18px 18px 14px; box-shadow:var(--shadow-sm);
  display:flex; flex-direction:column; height:230px;
  position:relative; overflow:hidden;
}
.chart-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
}
.chart-card[data-color="ind"]::before   { background:var(--c-ind); }
.chart-card[data-color="eq"]::before    { background:var(--c-eq); }
.chart-card[data-color="apres"]::before { background:var(--c-apres); }
.chart-card[data-color="prop"]::before  { background:var(--c-prop); }

.chart-card-title { font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; margin-bottom:10px; }
.chart-wrap { flex:1; position:relative; min-height:0; }

/* ── BOTTOM ROW ───────────────────────────────────────── */
.bottom-row { display:grid; grid-template-columns:1.5fr 1fr; gap:12px; }

.section-card {
  background:var(--surface); border-radius:12px;
  padding:20px 22px; box-shadow:var(--shadow-sm);
}
.section-title { font-size:12px; font-weight:700; color:var(--label); margin-bottom:14px; }
.section-head { margin-bottom:14px; }
.section-head .section-title { margin-bottom:4px; }
.section-subtitle {
  font-size:11px; font-weight:500; color:var(--muted); line-height:1.35;
  letter-spacing:.01em; margin:0;
}

/* Pendências table */
.pend-table { width:100%; border-collapse:collapse; font-size:12px; }
.pend-table th {
  text-align:left; font-size:9px; font-weight:700; color:var(--sub);
  text-transform:uppercase; letter-spacing:.07em;
  padding:0 8px 8px 0; border-bottom:1px solid var(--border);
}
.pend-table td {
  padding:9px 8px 9px 0; border-bottom:1px solid var(--border);
  color:var(--label); vertical-align:middle;
}
.pend-table tr:last-child td { border-bottom:none; }
.pend-table tr:hover td { background:var(--surface2); }
.dias-badge {
  display:inline-flex; align-items:center; justify-content:center;
  width:28px; height:20px; border-radius:5px;
  font-size:10px; font-weight:700;
}
.dias-badge.ok    { background:rgba(5,150,105,0.10); color:#059669; }
.dias-badge.warn  { background:rgba(217,119,6,0.10);  color:#D97706; }
.dias-badge.late  { background:rgba(220,38,38,0.10);  color:#DC2626; }
.pend-more { font-size:11px; color:var(--c-ind); font-weight:600; cursor:pointer; margin-top:10px; display:inline-block; }
.pend-empty { font-size:12px; color:var(--sub); padding:16px 0; text-align:center; }

/* Insights */
.insights-list { display:flex; flex-direction:column; gap:0; }
.insight-item {
  display:flex; align-items:flex-start; gap:12px;
  padding:13px 0; border-bottom:1px solid var(--border);
}
.insight-item:last-child { border-bottom:none; }
.insight-icon {
  width:34px; height:34px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700;
}
.insight-text { flex:1; }
.insight-title { font-size:12px; font-weight:700; color:var(--label); margin-bottom:3px; }
.insight-body  { font-size:11px; color:var(--muted); line-height:1.5; }

/* ── ESTADO VAZIO ─────────────────────────────────────── */
.estado {
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; flex:1; gap:10px;
  min-height:300px;
}
.estado-icon { font-size:44px; opacity:.15; }
.estado-msg  { font-size:14px; color:var(--sub); font-weight:500; }
.estado-hint { font-size:12px; color:var(--sub); opacity:.65; }

/* ── SCROLLBAR ────────────────────────────────────────── */
.main::-webkit-scrollbar { width:5px; }
.main::-webkit-scrollbar-track { background:transparent; }
.main::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.12); border-radius:10px; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div>
      <div class="sidebar-logo-name">Guarani Sistemas</div>
      <div class="sidebar-logo-sub">COMERCIAL 2026</div>
    </div>
  </div>

  <div class="sidebar-profile" id="sidebarProfile">
    <div class="profile-photo-placeholder" style="opacity:.3">—</div>
    <div class="profile-name" style="color:rgba(255,255,255,0.3);font-size:11px;">Nenhum vendedor</div>
  </div>

  <div class="sidebar-footer" id="sidebarFooter">Carregando...</div>
</aside>

<!-- CONTENT -->
<div class="content">

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-left">
      <select class="tb-select" id="vendedorSelect">
        <option value="">— selecione o vendedor —</option>
      </select>
    </div>
    <span class="topbar-title" id="topbarMes"></span>
    <div class="topbar-right">
      <span class="topbar-ts" id="topbarTs">—</span>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main" id="mainArea">
    <div class="estado">
      <div class="estado-icon">📊</div>
      <p class="estado-msg">Nenhum vendedor selecionado</p>
      <p class="estado-hint">Use o seletor acima para visualizar o dashboard de metas</p>
    </div>
  </main>

</div>

<script>
Chart.register(ChartDataLabels);

// ── Helpers ───────────────────────────────────────────────────────────────────
const FOTO_MAP = {
  rayssa:  '/dados/img/rayssa.png',
  junior:  '/dados/img/junior.png',
  paulo:   '/dados/img/paulo.png',
  ronaldo: '/dados/img/ronaldo.png',
};
function fotoVendedor(nome) {
  const k = (nome||'').split(' ')[0].toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  return FOTO_MAP[k] || null;
}
function last(arr)       { return arr?.length ? arr[arr.length-1] : 0; }
function prev(arr)       { return arr?.length >= 2 ? arr[arr.length-2] : null; }
function pctArr(real, ob){ return real.map((v,i) => ob[i] > 0 ? Math.round(v/ob[i]*100) : 0); }
function colorOf(v)      { return v>=100?'var(--c-ind)':v>=50?'var(--c-prop)':'#DC2626'; }
function classOf(v)      { return v>=100?'pos':v<0?'neg':'neg'; }
function fmtPct(v)       { return v.toFixed(v%1===0?0:1)+'%'; }
function ppDelta(v)      {
  const d = (v-100).toFixed(1);
  return { txt: (d>=0?'+':'')+d+' p.p.', cls: d>=0?'pos':'neg' };
}
function scoreCalc(ind, apres, prop) {
  return Math.min(ind,100)*0.50 + Math.min(apres,100)*0.25 + Math.min(prop,100)*0.25;
}
function now() {
  return new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}).toUpperCase()
    + ' ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

// ── Sparkline SVG ─────────────────────────────────────────────────────────────
function sparkline(values, color) {
  if (!values || values.length < 2) return '';
  const W=88, H=38, pad=3;
  const min = Math.min(...values, 0);
  const max = Math.max(...values, 0.1);
  const rng = max - min || 1;
  const pts = values.map((v,i) => {
    const x = pad + (i/(values.length-1))*(W-pad*2);
    const y = H - pad - ((v-min)/rng)*(H-pad*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const lx = (W-pad).toFixed(1);
  const ly = (H-pad-((last(values)-min)/rng)*(H-pad*2)).toFixed(1);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="overflow:visible">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8"
      stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>
    <circle cx="${lx}" cy="${ly}" r="2.8" fill="${color}"/>
  </svg>`;
}

// ── Score Ring ────────────────────────────────────────────────────────────────
function scoreRing(pct, color) {
  const r=34, cx=40, cy=40, circ=2*Math.PI*r;
  const dash=(Math.min(pct,100)/100*circ).toFixed(2);
  return `<div class="score-ring">
    <svg width="80" height="80" viewBox="0 0 80 80">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="7"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="7"
        stroke-dasharray="${dash} ${circ.toFixed(2)}" stroke-linecap="round"/>
    </svg>
    <div class="score-ring-label">
      <span class="score-ring-val">${pct.toFixed(0)}%</span>
      <span class="score-ring-sub">Score</span>
    </div>
  </div>`;
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
/** Retorna "Vendedora" ou "Vendedor" conforme o primeiro nome (heurística PT-BR). */
function cargoPorNome(nomeCompleto) {
  const raw = ((nomeCompleto || '').trim().split(/\s+/)[0] || '');
  const n = raw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  if (!n) return 'Vendedor';
  const mascTerminamEmA = new Set(['luca']);
  /* Nomes femininos que não terminam em "a" (Beatriz, Ingrid etc.) */
  const femininoExplicito = new Set([
    'beatriz','ingrid','ellen','simone','joyce','deborah','ester'
  ]);
  if (mascTerminamEmA.has(n)) return 'Vendedor';
  if (femininoExplicito.has(n)) return 'Vendedora';
  if (n.endsWith('a')) return 'Vendedora';
  return 'Vendedor';
}

function renderSidebar(d, indVal, apresVal, propVal, eqVal) {
  const score = scoreCalc(indVal, apresVal, propVal);
  const sc    = score>=100?'#34D399':score>=50?'#FBBF24':'#F87171';
  const foto  = fotoVendedor(d.vendedor);
  const ini   = d.vendedor.charAt(0).toUpperCase();
  const indC  = colorOf(indVal); const eqC = colorOf(eqVal);

  document.getElementById('sidebarProfile').innerHTML = `
    ${foto
      ? `<img class="profile-photo" src="${foto}" alt="${d.vendedor}"
             onerror="this.outerHTML='<div class=\\'profile-photo-placeholder\\'>${ini}</div>'">`
      : `<div class="profile-photo-placeholder">${ini}</div>`}
    <div class="profile-name">${d.vendedor}</div>
    <div class="profile-role">${cargoPorNome(d.vendedor)}</div>
    <div class="score-wrap">
      ${scoreRing(score, sc)}
      <span class="score-caption">Score geral</span>
      <span class="score-como" title="Score = 50% Meta Individual + 25% Apresentações + 25% Propostas (teto 100% por indicador)">Como calculamos</span>
    </div>
    <div class="kpi-boxes">
      <div class="kpi-box">
        <span class="kpi-box-label">Meta ind.</span>
        <span class="kpi-box-val" style="color:${indC};">${fmtPct(indVal)}</span>
      </div>
      <div class="kpi-box">
        <span class="kpi-box-label">Meta eq.</span>
        <span class="kpi-box-val" style="color:${eqC};">${fmtPct(eqVal)}</span>
      </div>
    </div>
  `;
  document.getElementById('sidebarFooter').textContent = 'Atualizado ' + now();
  document.getElementById('topbarTs').textContent = 'Atualizado ' + now();

  const MESES_FULL = {Jan:'Janeiro',Fev:'Fevereiro',Mar:'Março',Abr:'Abril',Mai:'Maio',
    Jun:'Junho',Jul:'Julho',Ago:'Agosto',Set:'Setembro',Out:'Outubro',Nov:'Novembro',Dez:'Dezembro'};
  const mesAbrev = Array.isArray(d.meses) && d.meses.length ? d.meses[d.meses.length - 1] : '';
  const ano = new Date().getFullYear();
  document.getElementById('topbarMes').textContent = mesAbrev ? `${MESES_FULL[mesAbrev] || mesAbrev} ${ano}` : '';
}

// ── Alerts — por criticidade ──────────────────────────────────────────────────
// Cada alerta: { type, prioridade, msg }
// prioridade: 0=crítico(red) 1=atenção(amber) 2=info(blue) 3=ok(green)
function buildAlerts(d, indVal, apresVal, propVal, eqVal) {
  const candidatos = [];
  const prevInd  = prev(d.cobertura_individual);
  const nContr   = d.total_contratos_pendentes || 0;
  const nIndef   = d.total_perfil_indef        || 0;

  // ── CRÍTICO (vermelho) ─────────────────────────────────
  if (nContr === 0)
    candidatos.push({type:'red', p:0,
      msg:`Sem contratos pendentes registrados — verifique o pipeline de fechamento`});

  if (indVal < 25)
    candidatos.push({type:'red', p:0,
      msg:`Meta individual crítica: ${fmtPct(indVal)} — intervenção imediata necessária`});

  if (prevInd !== null && (indVal - prevInd) < -20)
    candidatos.push({type:'red', p:0,
      msg:`Queda brusca de ${(prevInd-indVal).toFixed(1)} p.p. na meta individual vs mês anterior`});

  // ── ATENÇÃO (âmbar) ────────────────────────────────────
  if (indVal >= 25 && indVal < 60)
    candidatos.push({type:'amber', p:1,
      msg:`Meta individual em ${fmtPct(indVal)} — ritmo abaixo do esperado para o período`});

  if (nIndef > 5)
    candidatos.push({type:'amber', p:1,
      msg:`${nIndef} leads no CRM com perfil indefinido — qualifique para avançar no funil`});

  if (apresVal > 0 && propVal / apresVal < 0.25)
    candidatos.push({type:'amber', p:1,
      msg:`Conversão apres→proposta em ${fmtPct(propVal/apresVal*100)} — abaixo do esperado`});

  if (prevInd !== null && indVal < prevInd && (prevInd - indVal) >= 10)
    candidatos.push({type:'amber', p:1,
      msg:`Meta individual caiu ${(prevInd-indVal).toFixed(1)} p.p. em relação ao mês anterior`});

  if (eqVal < 40)
    candidatos.push({type:'amber', p:1,
      msg:`Equipe em ${fmtPct(eqVal)} da meta coletiva — impacta bônus do time`});

  // ── INFO / POSITIVO ────────────────────────────────────
  if (nContr > 0)
    candidatos.push({type:'blue', p:2,
      msg:`${nContr} contrato${nContr>1?'s':''} pendente${nContr>1?'s':''} aguardando assinatura`});

  if (nIndef > 0 && nIndef <= 5)
    candidatos.push({type:'amber', p:1,
      msg:`${nIndef} lead${nIndef>1?'s':''} com perfil indefinido no CRM — qualifique a tag`});

  if (indVal >= 60 && indVal < 100)
    candidatos.push({type:'blue', p:2,
      msg:`Meta individual em ${fmtPct(indVal)} — caminhando para atingir o objetivo`});

  if (prevInd !== null && indVal > prevInd)
    candidatos.push({type:'green', p:3,
      msg:`Crescimento de ${(indVal-prevInd).toFixed(1)} p.p. vs mês anterior — tendência positiva`});

  if (indVal >= 100)
    candidatos.push({type:'green', p:3,
      msg:`Meta individual atingida (${fmtPct(indVal)}) — excelente desempenho! 🎯`});

  if (apresVal >= 100)
    candidatos.push({type:'green', p:3,
      msg:`Meta de apresentações no ritmo (${fmtPct(apresVal)}) ✓`});

  // Ordenar por criticidade e pegar os 3 mais relevantes
  candidatos.sort((a,b) => a.p - b.p);
  const vistos = new Set();
  const selecionados = [];
  for (const c of candidatos) {
    if (!vistos.has(c.type) || selecionados.length < 3) {
      selecionados.push(c);
      vistos.add(c.type);
      if (selecionados.length === 3) break;
    }
  }
  // Garantir sempre 3
  while (selecionados.length < 3)
    selecionados.push({type:'blue', p:2,
      msg:`Score geral: ${fmtPct(scoreCalc(indVal,apresVal,propVal))} — acompanhe a evolução mensal`});

  return selecionados;
}

/** Quando a API antiga mandava a série da equipe com todos os meses mas só havia rótulos do vendedor,
 *  o Chart.js usava o 1º valor (ex.: jan ~22%) no único rótulo "Mai". Mantém último valor se 1 rótulo e N valores. */
function serieEquipeParaGrafico(meses, coberturaEquipe) {
  if (!meses || !coberturaEquipe) return coberturaEquipe || [];
  if (meses.length === coberturaEquipe.length) return coberturaEquipe;
  if (meses.length === 1 && coberturaEquipe.length > 1)
    return [coberturaEquipe[coberturaEquipe.length - 1]];
  return coberturaEquipe.slice(0, meses.length);
}

/** Mesma regra do app.py: até abr/2026 ÷3×3; maio/2026+ ÷4×4 — ver equipe_divisor no JSON. */
function valoresCoberturaEquipe(d) {
  const ce = d.cobertura_equipe;
  if (Array.isArray(ce) && Array.isArray(d.meses) && ce.length === d.meses.length) {
    return ce.map(x => Number(x));
  }
  const b = d.equipe_breakdown;
  if (!b || !Array.isArray(b.meta_equipe) || !Array.isArray(b.obequipe_milhares)) {
    return serieEquipeParaGrafico(d.meses, ce || []);
  }
  const divisores = b.equipe_divisor;
  const out = [];
  for (let i = 0; i < d.meses.length; i++) {
    const me = Number(b.meta_equipe[i]);
    const oq = Number(b.obequipe_milhares[i]);
    if (!oq || oq <= 0) {
      out.push(0);
      continue;
    }
    const div = divisores && divisores[i] != null ? Number(divisores[i]) : 3;
    const frac = ((me / (oq * 1000)) / div) * div;
    out.push(Math.round(frac * 1000) / 10);
  }
  return out;
}

/** DD/MM/AAAA no fuso local; dias desde essa data até hoje (≥0). */
function diasDecorridosDaDataBr(dataStr) {
  if (!dataStr || dataStr === '—') return null;
  const m = String(dataStr).trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (!m) return null;
  const dia = parseInt(m[1], 10), mes = parseInt(m[2], 10) - 1, ano = parseInt(m[3], 10);
  const ref = new Date(ano, mes, dia);
  if (Number.isNaN(ref.getTime())) return null;
  const a = new Date();
  const hoje = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const diff = Math.round((hoje - ref) / 864e5);
  return diff < 0 ? 0 : diff;
}

/** API pode mandar dias; se vier vazio (ex.: cache antigo), calcula para contratos pela data exibida. */
function diasParaExibir(p) {
  const d = p.dias;
  if (d !== null && d !== undefined && d !== '') {
    const n = Number(d);
    if (!Number.isNaN(n)) return n;
  }
  if (p.origem === 'contrato' && p.data)
    return diasDecorridosDaDataBr(p.data);
  return null;
}

function diasBadge(p) {
  const val = diasParaExibir(p);
  if (val === null || val === undefined)
    return '<span class="dias-badge warn" title="Sem data para calcular">—</span>';
  const cls = val<=7?'ok':val<=20?'warn':'late';
  return `<span class="dias-badge ${cls}">${val}</span>`;
}
function origemBadge(origem) {
  if (origem==='contrato')
    return '<span style="font-size:9px;font-weight:700;color:#059669;background:rgba(5,150,105,0.10);padding:2px 7px;border-radius:4px;">CONTRATO</span>';
  return '<span style="font-size:9px;font-weight:700;color:#7C3AED;background:rgba(124,58,237,0.10);padding:2px 7px;border-radius:4px;">CRM</span>';
}
function renderPendencias(lista) {
  if (!lista || !lista.length)
    return `<div class="pend-empty">Nenhuma pendência encontrada</div>`;
  const seen = new Set();
  lista = lista.filter(p => {
    const key = `${p.origem}|${(p.titulo||'').trim().toLowerCase()}|${p.data||''}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  const rows = lista.slice(0,8).map(p=>`
    <tr>
      <td>${origemBadge(p.origem)}</td>
      <td style="font-weight:600;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${p.titulo}">${p.titulo}</td>
      <td style="color:var(--sub);font-size:11px;">${p.data||'—'}</td>
      <td>${diasBadge(p)}</td>
    </tr>`).join('');
  const mais = lista.length>8
    ? `<span class="pend-more">+ ${lista.length-8} itens</span>` : '';
  return `
    <table class="pend-table">
      <thead><tr>
        <th>Origem</th><th>Cliente / Título</th><th>Data contrato/criação</th><th>Dias</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${mais}`;
}

function renderDashboard(d) {

  const propVal = last(propP);

  renderSidebar(d, indVal, apresVal, propVal, eqVal);

  const alerts   = buildAlerts(d, indVal, apresVal, propVal, eqVal);
  const insights = buildInsights(d, indVal, apresVal, propVal, eqVal);

  function kpiCard(label, val, history, color, borderColor) {
    const dp = ppDelta(val);
    const p  = prev(history);
    const trend = p!==null ? `${val>=p?'▲':'▼'} ${Math.abs(val-p).toFixed(1)} p.p. vs mês ant.` : 'Primeiro mês';
    return `
      <div class="kpi-card" style="border-left-color:${borderColor}">

          <div class="kpi-sparkline">${sparkline(history, borderColor)}</div>

        <div class="kpi-delta ${dp.cls}">${dp.txt}</div>
        <div class="kpi-trend">${trend}</div>

  }

  function alertsHtml() {
    const items = alerts.map((a,i) => `
      ${i>0?'<div class="alert-sep"></div>':''}
      <div class="alert-item">
        <div class="alert-dot ${a.type}"></div>
        <span>${a.msg}</span>
      </div>`).join('');
    return `<div class="alerts-card">
      <span class="alerts-title">Alertas e foco</span>

    return insights.map(ins=>`
      <div class="insight-item">

          <div class="insight-title">${ins.title}</div>
          <div class="insight-body">${ins.body}</div>
        </div>
      </div>`).join('');
  }

  document.getElementById('mainArea').innerHTML = `
    ${alertsHtml()}

    <div class="kpi-row">
      ${kpiCard('Cobertura individual', indVal,  d.cobertura_individual, 'var(--c-ind)',  '#059669')}
      ${kpiCard('Cobertura equipe',     eqVal,   eqSerie,                'var(--c-eq)',   '#3B82F6')}
      ${kpiCard('Apresentações',        apresVal, apresP,                'var(--c-apres)','#7C3AED')}
      ${kpiCard('Propostas',            propVal,  propP,                 'var(--c-prop)', '#D97706')}
    </div>

    <div class="charts-row">
      <div class="chart-card" data-color="ind">
        <div class="chart-card-title">Cobertura individual (% da meta)</div>
        <div class="chart-wrap"><canvas id="cInd"></canvas></div>
      </div>
      <div class="chart-card" data-color="eq">
        <div class="chart-card-title">Cobertura equipe (% da meta)</div>
        <div class="chart-wrap"><canvas id="cEq"></canvas></div>
      </div>
      <div class="chart-card" data-color="apres">
        <div class="chart-card-title">Apresentações (% da meta)</div>
        <div class="chart-wrap"><canvas id="cApres"></canvas></div>
      </div>
      <div class="chart-card" data-color="prop">
        <div class="chart-card-title">Propostas (% da meta)</div>
        <div class="chart-wrap"><canvas id="cProp"></canvas></div>
      </div>
    </div>

    <div class="bottom-row">
      <div class="section-card">
        <div class="section-head">
          <div class="section-title">Pendências unificadas</div>
          <p class="section-subtitle">Contratos Pendentes e TAG Sem Perfil Definido</p>
        </div>
        ${renderPendencias(d.pendencias)}
      </div>
      <div class="section-card">
        <div class="section-title">Insights do mês</div>
        <div class="insights-list">${insightsHtml()}</div>
      </div>
    </div>
  `;

  _charts.ind   = buildBar('cInd',   d.meses, d.cobertura_individual, 'ind');
  _charts.eq    = buildBar('cEq',    d.meses, eqSerie, 'eq');
  _charts.apres = buildBarQtyPct('cApres', d.meses, apresP, d.apresentacao || [], 'apres');
  _charts.prop  = buildBarQtyPct('cProp',  d.meses, propP,  d.proposta || [],      'prop');
}

// ── Bootstrap — troca de vendedor só atualiza JSON (sem recarregar página); cache por vendedor ──
/** Incrementar quando mudar o cálculo da API (ex.: cobertura equipe) para forçar novo fetch e não reusar JSON velho na mesma aba. */
const METAS_CACHE_VER = 8;
/** Deve coincidir com dashboard_payload_ver em app.py — invalida cache salvo antes dessa versão do payload. */
const DASH_PAYLOAD_VER = 4;
/** Persiste o vendedor escolhido para sobreviver a F5 / atualização do navegador (mesma aba). */
const METAS_VENDEDOR_STORAGE_KEY = 'guarani_dashboard_metas_vendedor';
const metasPorVendedor = Object.create(null);
let ultimoVendedorCarregado = null;

function persistVendedorNoStorage(v) {
  try {
    if (v) sessionStorage.setItem(METAS_VENDEDOR_STORAGE_KEY, v);
    else sessionStorage.removeItem(METAS_VENDEDOR_STORAGE_KEY);
  } catch (e) { /* modo privado etc. */ }
}

function aplicarMetas(json) {
  if (json.erro) { console.error(json.erro); return; }
  const nome = json.vendedor;
  if (nome) {
    json._metasCache = METAS_CACHE_VER;
    metasPorVendedor[nome] = json;
  }
  ultimoVendedorCarregado = nome || null;
  renderDashboard(json);
}

function estadoSemVendedor() {
  ultimoVendedorCarregado = null;
  destroyCharts();
  document.getElementById('mainArea').innerHTML = `
    <div class="estado">
      <div class="estado-icon">📊</div>
      <p class="estado-msg">Nenhum vendedor selecionado</p>
      <p class="estado-hint">Use o seletor acima para visualizar o dashboard de metas</p>
    </div>`;
  document.getElementById('sidebarProfile').innerHTML = `
    <div class="profile-photo-placeholder" style="opacity:.3">—</div>
    <div class="profile-name" style="color:rgba(255,255,255,0.3);font-size:11px;">Nenhum vendedor</div>`;
  document.getElementById('sidebarFooter').textContent = '—';
  document.getElementById('topbarTs').textContent = '—';
}

function carregarMetas(v) {
  if (!v) return;
  const cached = metasPorVendedor[v];
  if (cached && cached._metasCache === METAS_CACHE_VER && cached.dashboard_payload_ver === DASH_PAYLOAD_VER) {
    ultimoVendedorCarregado = v;
    aplicarMetas(cached);
    return;
  }
  fetch(`/api/metas-vendedor?vendedor=${encodeURIComponent(v)}&cb=${METAS_CACHE_VER}`)
    .then(r=>r.json())
    .then(aplicarMetas)
    .catch(console.error);
}

fetch('/api/metas-vendedor?cb=' + METAS_CACHE_VER)
  .then(r=>r.json())
  .then(d=>{
    const sel = document.getElementById('vendedorSelect');
    sel.setAttribute('autocomplete', 'off');
    (d.vendedores||[]).forEach(v=>{
      const o=document.createElement('option');
      o.value=v; o.textContent=v; sel.appendChild(o);
    });
    sel.addEventListener('change', ()=>{
      persistVendedorNoStorage(sel.value);
      if (!sel.value) {
        estadoSemVendedor();
        return;
      }
      carregarMetas(sel.value);
    });

    let salvo = null;
    try { salvo = sessionStorage.getItem(METAS_VENDEDOR_STORAGE_KEY); } catch (e) {}
    const nomes = new Set((d.vendedores||[]));
    if (salvo && nomes.has(salvo)) {
      sel.value = salvo;
      carregarMetas(salvo);
    }
  })
  .catch(console.error);
</script>
</body>
</html>
